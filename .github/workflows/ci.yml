name: ci
on: [push, pull_request]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['backend/**', 'compose.yaml', '.github/**']
            web: ['web/**', 'backend/docs/openapi.json', '.github/**']

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait postgres minio
        working-directory: .
      - run: uv sync --frozen --extra mcp
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
      # The committed contract must match the code; the dashboard's types are generated from it.
      - run: uv run python scripts/export_openapi.py && git diff --exit-code -- docs/openapi.json
      - if: always()
        run: docker compose logs --tail=60 postgres minio
        working-directory: .

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
